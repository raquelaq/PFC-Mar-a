<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PFC | Portada</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; overflow-x: hidden; background: #fff; }
  .portada { width: 100%; margin: 0; padding: 0; }
  .portada img { display: block; width: 100%; height: auto; }
  .centros-arte { width: 100%; margin: 0; padding: 0; background: #fff; }
  .centros-arte img { display: block; width: 100%; height: auto; }
  .tercera-imagen { width: 100%; margin: 0; padding: 0; background: #fff; }
  .tercera-imagen img { display: block; width: 100%; height: auto; }
  .cuarta-imagen { width: 100%; margin: 0; padding: 0; background: #fff; }
  .cuarta-imagen img { display: block; width: 100%; height: auto; }
  .quinta-imagen { width: 100%; margin: 0; padding: 0; background: #fff; }
  .quinta-imagen img { display: block; width: 100%; height: auto; }
  .sexta-imagen { width: 100%; margin: 0; padding: 0; background: #fff; }
  .sexta-imagen img { display: block; width: 100%; max-width: 100%; height: auto; }
  .septima-imagen { width: 100%; margin: 0; padding: 0; background: #fff; }
  .septima-imagen img { display: block; width: 100%; max-width: 100%; height: auto; }
  .octava-imagen { width: 100%; margin: 0; padding: 0; background: #fff; }
  .octava-imagen img { display: block; width: 100%; max-width: 100%; height: auto; }
  .novena-imagen, .decima-imagen { width: 100%; margin: 0; padding: 0; background: #fff; }
  .novena-imagen img, .decima-imagen img { display: block; width: 100%; max-width: 100%; height: auto; }
  .white-space { height: 70svh; background: #fff; }
  .video-section { width: 100%; background: #fff; padding: 0 0 10vh; }
  .video-section video { display: block; width: 100%; height: auto; max-height: 100svh; object-fit: contain; background: #000; }
  .gif-section { width: 100%; background: #fff; padding: 10vh 0 12vh; display: flex; justify-content: center; align-items: center; }
  .gif-section img { display: block; width: 100%; height: auto; object-fit: contain; background: #fff; }
  @media (max-width: 600px) {
    .white-space { height: 4svh; }
    .video-section { padding: 0 0 4svh; }
    .video-section video { max-height: none; }
    .gif-section { padding: 4svh 0 6svh; }
    .gif-section img { max-height: none; }
  }
</style>
</head>
<body>
<main>
  <section class="portada" aria-label="Portada del proyecto">
    <img src="1_PORTADA.jpg.jpeg" alt="Portada del proyecto arquitectónico" fetchpriority="high">
  </section>
  <section class="centros-arte" aria-label="Centros de arte de la isla">
    <img src="2_centros%20de%20arte%20isla.gif" alt="Animación sobre los centros de arte de la isla" loading="eager">
  </section>
  <section class="tercera-imagen" aria-label="Tercera lámina del proyecto">
    <img src="3_nuevo%20FORMATO%20MOVIL_organized%20%281%29_organized%20%281%29_page-0001.jpg.jpeg" alt="Tercera lámina del proyecto" loading="eager">
  </section>
  <section class="cuarta-imagen" aria-label="Cuarta lámina del proyecto">
    <img src="4_nuevo%20FORMATO%20MOVIL_organized%20%281%29_organized%20%281%29_page-0002.jpg.jpeg" alt="Cuarta lámina del proyecto" loading="eager">
  </section>
  <section class="quinta-imagen" aria-label="Quinta lámina animada del proyecto">
    <img src="5_nuevo%20FORMATO%20MOVIL_organized%20%281%29_organized_pages-to-jpg-0006.gif" alt="Quinta lámina animada del proyecto" loading="eager">
  </section>
  <section class="sexta-imagen" aria-label="Sexta lámina del proyecto">
    <img src="6_nuevo%20FORMATO%20MOVIL_organized%20%281%29_organized%20%281%29_page-0003.jpg.jpeg" alt="Sexta lámina del proyecto" loading="eager">
  </section>
  <section class="septima-imagen" aria-label="Séptima lámina del proyecto">
    <img src="7_nuevo%20FORMATO%20MOVIL_organized%20%281%29_organized%20%281%29_page-0004.jpeg" alt="Séptima lámina del proyecto" loading="eager">
  </section>
  <section class="white-space" aria-hidden="true"></section>
  <section class="video-section">
    <video autoplay muted loop playsinline preload="auto">
      <source src="Video%20Project%203.mp4" type="video/mp4">
      Tu navegador no puede reproducir este vídeo.
    </video>
  </section>
  <section class="gif-section">
    <img src="AXONOMETRICA.gif" alt="Axonometría animada" loading="lazy">
  </section>
  <section class="octava-imagen" aria-label="Octava lámina del proyecto">
    <img src="8_nuevo%20FORMATO%20MOVIL_organized%20%281%29_organized%20%281%29_page-0005.jpg.jpeg" alt="Octava lámina del proyecto" loading="lazy">
  </section>
  <section class="novena-imagen" aria-label="Lámina 9 del proyecto">
    <img src="9_nuevo%20FORMATO%20MOVIL_organized%20%281%29_organized%20%281%29_page-0006.jpg.jpeg" alt="Lámina 9 del proyecto" loading="lazy">
  </section>
  <section class="decima-imagen" aria-label="Lámina 10 del proyecto">
    <img src="10_nuevo%20FORMATO%20MOVIL_organized%20%281%29_organized%20%281%29_page-0007.jpg.jpeg" alt="Lámina 10 del proyecto" loading="lazy">
  </section>
</main>
</body>
</html>
